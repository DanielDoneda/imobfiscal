spring.profiles.active=dev
server.port=${PORT:8080}

# Auditoria em banco nao relacional (MongoDB). Fica desativada ate a conexao ser configurada.
app.audit.enabled=${AUDIT_ENABLED:false}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/imobfiscal_auditoria}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
app.security.jwt.secret=${JWT_SECRET:imobfiscal-chave-local-trocar-em-producao-2026}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}
